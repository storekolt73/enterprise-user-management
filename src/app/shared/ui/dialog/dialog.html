<div class="dialog">
  <h2 class="dialog__title">{{ data.title }}</h2>

  <p class="dialog__message">
    {{ data.message }}
  </p>

  <div class="dialog__actions">
    <button type="button" (click)="cancel()">
      Cancel
    </button>

    <button type="button" (click)="confirm()">
      Delete
    </button>
  </div>
</div>
