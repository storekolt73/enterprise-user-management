<header class="app-header">
  <div class="brand">
    <span class="brand-mark">EU</span>

    <div>
      <strong>Enterprise User Management</strong>
      <span>Administration System</span>
    </div>
  </div>

  <div class="header-user">
    @if (authService.currentUser(); as session) {
      <span class="user-avatar">
        {{ session.user.displayName.slice(0, 2).toUpperCase() }}
      </span>

      <div>
        <strong>{{ session.user.displayName }}</strong>
        <span>{{ session.user.username }}</span>
      </div>
    }

    <button type="button" (click)="logout()">
      Logout
    </button>
  </div>
</header>

<div class="app-body">
  <aside class="app-sidebar">
    <nav aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a routerLink="/users" routerLinkActive="active">
        Users
      </a>
      <a routerLink="/user-table" routerLinkActive="active">
        User Table
      </a>
      <a routerLink="/user-data-view" routerLinkActive="active">
        User View
      </a>
    </nav>
  </aside>

  @if (toastService.message(); as message) {
    <app-toast
      [message]="message"
      [type]="toastService.type()"
    />
  }

  <main class="app-content">
    <router-outlet />
  </main>
</div>
